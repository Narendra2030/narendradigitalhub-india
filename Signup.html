<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign Up | NKDIGITALHUB2030</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f8fafc;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.signup-box{

background:white;

padding:40px;

width:340px;

border-radius:12px;

box-shadow:0 10px 30px rgba(0,0,0,.12);

text-align:center;

}

.logo{

font-size:32px;

font-weight:bold;

margin-bottom:10px;

}

.nk{color:#2563eb;}
.digital{color:#7c3aed;}
.hub{color:#10b981;}
.y2030{color:#f59e0b;}

.subtitle{

color:#555;

margin-bottom:25px;

}

input{

width:100%;

padding:12px;

margin:10px 0;

border:1px solid #ddd;

border-radius:8px;

box-sizing:border-box;

}

button{

width:100%;

padding:12px;

background:#2563eb;

color:white;

border:none;

border-radius:8px;

font-size:16px;

cursor:pointer;

}

button:hover{

opacity:.9;

}

.login{

margin-top:18px;

}

.login a{

text-decoration:none;

color:#2563eb;

}

</style>

</head>

<body>

<div class="signup-box">

<div class="logo">

<span class="nk">NK</span>
<span class="digital">DIGITAL</span>
<span class="hub">HUB</span>
<span class="y2030">2030</span>

</div>

<p class="subtitle">

Create Your Account

</p>

<form>

<input
type="text"
placeholder="Full Name"
required>

<input
type="email"
placeholder="Email"
required>

<input
type="password"
placeholder="Password"
required>

<input
type="password"
placeholder="Confirm Password"
required>

<button type="submit">

Sign Up

</button>

</form>

<div class="login">

Already have an account?

<a href="login.html">

Login

</a>

</div>

</div>

</body>

</html><p id="msg"></p>

</div>

<script type="module" src="App.js"></script>

</body>
</html>
