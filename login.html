<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Secure login gateway to access your authenticated NK Digital Hub 2030 member account and profile workspace.">
  <meta name="author" content="Narendra Kumar">
  <title>Login | NK Digital Hub 2030</title>
  
  <style>
    :root {
      --primary-color: #06264d;
      --secondary-color: #0877c9;
      --dark-accent: #123b68;
      --text-main: #172033;
      --text-muted: #64778e;
      --bg-main: #eef3f9;
      --border-color: #cbdced;
      --transition-smooth: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI", Inter, Roboto, Arial, sans-serif;
      color: var(--text-main);
      background: var(--bg-main);
      line-height: 1.6;
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    .container { width: min(1180px, 92%); margin: 0 auto; }

    .site-header {
      position: sticky; top: 0; z-index: 9999;
      background: linear-gradient(135deg, #ffffff, #f4f8ff);
      border-bottom: 1px solid #d7e2f0; box-shadow: 0 4px 15px rgba(15, 45, 80, 0.06);
    }

    .nav-container { min-height: 74px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
    .logo { color: var(--primary-color); font-size: 21px; font-weight: 800; }
    .nav-menu { display: flex; gap: 15px; align-items: center; }
    .nav-menu a { color: #344b68; font-size: 14px; font-weight: 700; padding: 8px 12px; border-radius: 6px; }
    .nav-menu a:hover { background: #edf5ff; color: var(--secondary-color); }

    .auth-section {
      min-height: calc(100vh - 74px); display: flex; align-items: center; justify-content: center; padding: 40px 20px;
      background: radial-gradient(circle at 15% 15%, rgba(8,119,201,0.08), transparent 30%), #eef4fa;
    }

    .auth-card {
      width: min(420px, 100%); padding: 40px 30px; background: #ffffff;
      border: 1px solid var(--border-color); border-radius: 16px; box-shadow: 0 15px 35px rgba(16,52,87,0.08);
    }

    .auth-icon {
      width: 60px; height: 60px; display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px; border-radius: 12px; background: #e1f3ff; font-size: 28px;
    }

    .auth-card h1 { color: var(--dark-accent); text-align: center; font-size: 26px; margin-bottom: 8px; font-weight: 800; }
    .auth-subtitle { margin-bottom: 25px; color: var(--text-muted); text-align: center; font-size: 14px; }

    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 6px; color: #314b67; font-size: 14px; font-weight: 700; }
    .form-group input {
      width: 100%; padding: 12px 14px; background: #ffffff; border: 1px solid #c4d4e5; border-radius: 8px;
      outline: none; transition: all var(--transition-smooth);
    }
    .form-group input:focus { border-color: var(--secondary-color); box-shadow: 0 0 0 4px rgba(8, 119, 201, 0.15); }

    .btn-primary {
      width: 100%; min-height: 46px; display: inline-flex; align-items: center; justify-content: center;
      color: #ffffff; background: linear-gradient(135deg, var(--secondary-color), #1554a5);
      border: none; border-radius: 8px; font-size: 15px; font-weight: 800; cursor: pointer; transition: all var(--transition-smooth);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 15px rgba(8,119,201,0.25); }

    .auth-message { min-height: 24px; margin-top: 15px; color: #d93838; text-align: center; font-size: 14px; font-weight: 600; }
    .auth-footer { margin-top: 25px; padding-top: 20px; border-top: 1px solid #dce5ee; text-align: center; }
    .auth-footer p { margin: 8px 0; color: #65778c; font-size: 14px; }
    .auth-footer a { color: var(--secondary-color); font-weight: 700; }
    .auth-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container nav-container">
      <a href="index.html" class="logo">🌟 NK Digital Hub 2030</a>
      <nav class="nav-menu">
        <a href="index.html">Home</a>
        <a href="signup.html">Create Account</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="auth-section">
      <div class="auth-card">
        <div class="auth-icon">🔐</div>
        <h1>Welcome Back</h1>
        <p class="auth-subtitle">Login to access your secure NK Digital Hub 2030 account panel.</p>

        <form onsubmit="event.preventDefault(); login();">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
          </div>

          <button type="submit" class="btn-primary">Verify Credentials</button>
          <p id="msg" class="auth-message" aria-live="polite"></p>
        </form>

        <div class="auth-footer">
          <p>Don't have an account? <a href="signup.html">Create Account</a></p>
          <p><a href="index.html">← Back to Home</a></p>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="App.js"></script>
</body>
</html>
