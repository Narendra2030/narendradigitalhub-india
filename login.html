<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Login to your NK Digital Hub account."
  >

  <meta name="author" content="Narendra Kumar">

  <title>Login | NK Digital Hub</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>


  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="site-header">

    <div class="container nav-container">

      <a href="index.html" class="logo">
        🌟 NK Digital Hub
      </a>

      <nav class="nav-menu">

        <a href="index.html">
          Home
        </a>

        <a href="signup.html">
          Create Account
        </a>

      </nav>

    </div>

  </header>


  <!-- =====================================================
       LOGIN
  ====================================================== -->

  <main>

    <section class="auth-section">

      <div class="auth-card">


        <div class="auth-icon">
          🔐
        </div>


        <h1>
          Welcome Back
        </h1>


        <p class="auth-subtitle">
          Login to access your NK Digital Hub account.
        </p>


        <!-- LOGIN FORM -->

        <form
          onsubmit="event.preventDefault(); login();"
        >


          <!-- EMAIL -->

          <div class="form-group">

            <label for="email">
              Email Address
            </label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email"
              autocomplete="email"
              required
            >

          </div>


          <!-- PASSWORD -->

          <div class="form-group">

            <label for="password">
              Password
            </label>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

          </div>


          <!-- LOGIN BUTTON -->

          <button
            type="submit"
            class="btn btn-primary auth-button"
          >
            Login
          </button>


          <!-- MESSAGE -->

          <p
            id="msg"
            class="auth-message"
            aria-live="polite"
          ></p>


        </form>


        <!-- AUTH FOOTER -->

        <div class="auth-footer">


          <p>
            Don't have an account?
            <a href="signup.html">
              Create Account
            </a>
          </p>


          <p>
            <a href="index.html">
              ← Back to Home
            </a>
          </p>


        </div>


      </div>

    </section>

  </main>


  <!-- =====================================================
       FIREBASE APP
  ====================================================== -->

  <script
    type="module"
    src="app.js"
  ></script>


</body>
</html>
