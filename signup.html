<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Provision a secure new member account profile layer inside the NK Digital Hub 2030 network ecosystem to access premium dashboards.">
  <meta name="author" content="Narendra Kumar">
  <title>Create Account | NK Digital Hub 2030</title>
  <style>
    /* (CSS matches perfectly with login styles above for flawless consistency) */
    :root { --primary-color: #06264d; --secondary-color: #0877c9; --dark-accent: #123b68; --text-main: #172033; --text-muted: #64778e; --bg-main: #eef3f9; --border-color: #cbdced; --transition-smooth: 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Segoe UI", Inter, Roboto, Arial, sans-serif; color: var(--text-main); background: var(--bg-main); line-height: 1.6; min-height: 100vh; }
    a { color: inherit; text-decoration: none; }
    .site-header { position: sticky; top: 0; z-index: 9999; background: linear-gradient(135deg, #ffffff, #f4f8ff); border-bottom: 1px solid #d7e2f0; box-shadow: 0 5px 22px rgba(15, 45, 80, 0.08); }
    .nav-container { min-height: 74px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; margin: 0 auto; width: min(1180px, 92%); }
    .logo { color: var(--primary-color); font-size: 21px; font-weight: 800; letter-spacing: -0.4px; }
    .nav-menu { display: flex; gap: 8px; align-items: center; }
    .nav-menu a { color: #344b68; font-size: 14px; font-weight: 700; padding: 9px 12px; border-radius: 8px; transition: all var(--transition-smooth); }
    .nav-menu a:hover { background: #edf5ff; color: var(--secondary-color); }
    .auth-section { min-height: calc(100vh - 74px); display: flex; align-items: center; justify-content: center; padding: 50px 20px; background: radial-gradient(circle at 15% 20%, rgba(0, 170, 255, 0.25), transparent 35%), radial-gradient(circle at 85% 15%, rgba(87, 74, 255, 0.25), transparent 35%), linear-gradient(135deg, #06264d 0%, #084c83 48%, #152b73 100%); }
    .auth-card { width: min(440px, 100%); padding: 45px 35px; background: rgba(255, 255, 255, 0.98); border: 1px solid var(--border-color); border-radius: 20px; box-shadow: 0 25px 65px rgba(16, 52, 87, 0.25); }
    .auth-icon { width: 65px; height: 65px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; border-radius: 18px; background: linear-gradient(135deg, #e1f3ff, #e9e8ff); border: 1px solid #c7dff2; font-size: 30px; }
    .auth-card h1 { color: var(--dark-accent); text-align: center; font-size: 28px; margin-bottom: 8px; font-weight: 800; }
    .auth-subtitle { margin-bottom: 30px; color: var(--text-muted); text-align: center; font-size: 14px; }
    .form-group { margin-bottom: 22px; }
    .form-group label { display: block; margin-bottom: 8px; color: #314b67; font-size: 14px; font-weight: 800; }
    .form-group input { width: 100%; padding: 13px 15px; background: #ffffff; color: var(--text-main); border: 1px solid #c4d4e5; border-radius: 10px; outline: none; transition: all var(--transition-smooth); }
    .form-group input:focus { border-color: #1594d1; box-shadow: 0 0 0 4px rgba(21, 148, 209, 0.12); }
    .btn-primary { width: 100%; min-height: 48px; display: inline-flex; align-items: center; justify-content: center; color: #ffffff; background: linear-gradient(135deg, var(--secondary-color), #1554a5); border: none; border-radius: 10px; font-size: 15px; font-weight: 800; cursor: pointer; box-shadow: 0 7px 20px rgba(8, 119, 201, 0.25); transition: all var(--transition-smooth); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 27px rgba(8, 119, 201, 0.35); }
    .auth-message { min-height: 24px; margin-top: 15px; color: #16a34a; text-align: center; font-size: 14px; font-weight: 600; }
    .auth-footer { margin-top: 25px; padding-top: 20px; border-top: 1px solid #dce5ee; text-align: center; }
    .auth-footer p { margin: 8px 0; color: #65778c; font-size: 14px; }
    .auth-footer a { color: var(--secondary-color); font-weight: 800; }
    @media (max-width: 680px) { .nav-container { flex-direction: column; padding: 12px 0; gap: 10px; } .auth-card { padding: 35px 25px; } }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav-container">
      <a href="index.html" class="logo">🌟 NK Digital Hub 2030</a>
      <nav class="nav-menu">
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="auth-section">
      <div class="auth-card">
        <div class="auth-icon">👤</div>
        <h1>Create Account</h1>
        <p class="auth-subtitle">Provision your secure member account profile to unlock our premium tools.</p>

        <!-- FORM WITH DIRECT ID -->
        <form id="signupForm">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="name@example.com" autocomplete="email" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Create a strong password" minlength="6" autocomplete="new-password" required>
          </div>
          <button type="submit" class="btn-primary">Initialize Profile</button>
          <p id="msg" class="auth-message" aria-live="polite"></p>
        </form>

        <div class="auth-footer">
          <p>Already have an account? <a href="login.html">Login</a></p>
          <p><a href="index.html">← Back to Home</a></p>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="App.js"></script>
</body>
</html>
